services:
  dashboard:
    build: .
    container_name: vendor-dashboard
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - vendor_dashboard_data:/app/vendor_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  vendor_dashboard_data:
