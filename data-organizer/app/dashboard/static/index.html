<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HospKart Vendor Data Hub</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="shell">
    <aside class="side" aria-label="Main navigation">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="2" y="3" width="9" height="9" rx="2" fill="#5EC6BE"/><rect x="15" y="3" width="9" height="9" rx="2" fill="#5EC6BE" opacity=".55"/><rect x="2" y="15" width="9" height="9" rx="2" fill="#5EC6BE" opacity=".55"/><path d="M15 19.5h9M19.5 15v9" stroke="#5EC6BE" stroke-width="2.4" stroke-linecap="round"/></svg>
        <div><strong>Vendor Data Hub</strong><small>organize · chat · quote</small></div>
      </div>
      <div class="workspace-toggle" role="group" aria-label="Workspace">
        <button type="button" data-workspace="organizer">Organizer</button>
        <button type="button" data-workspace="vendor">Vendor</button>

      </div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <div id="runpill" class="pill idle" role="status" aria-live="polite">Idle</div>
        <div id="srclabel" class="muted small"></div>
      </div>
    </aside>
    <main class="main">
      <header class="top"><h1 id="title">Overview</h1><div id="topactions"></div></header>
      <section id="view" tabindex="-1"></section>
    </main>
  </div>
  <div id="drawer" class="drawer" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="workspaceFloat" class="workspace-float" role="group" aria-label="Workspace">
    <button type="button" data-workspace="organizer">Organizer</button>
    <button type="button" data-workspace="vendor">Vendor</button>

  </div>
  <script src="/static/vendor/chart.umd.js"></script>
  <script src="/static/app.js?v=12"></script>
</body>
</html>
