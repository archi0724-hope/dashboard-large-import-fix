<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · HospKart</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;color:#101522;background:#fff}.login-card{width:min(455px,100%);padding:28px 27px 24px}h1{font-size:22px;margin:0 0 28px}label{display:block;font-weight:650;margin:0 0 8px 2px}.field{position:relative;margin-bottom:16px}input{width:100%;height:51px;border:1px solid #e0e0e5;border-radius:13px;background:#f5f5fd;padding:0 16px;font:14px system-ui;color:#101522}input[type=password],#password{padding-right:54px}input:focus{outline:2px solid #7751ef;outline-offset:2px}.eye{position:absolute;right:12px;top:11px;width:30px;height:30px;display:grid;place-items:center;border:0;background:transparent;color:#60606a;cursor:pointer}.eye svg{width:24px;height:24px}.forgot{display:inline-block;color:#7648ff;font-weight:650;text-decoration:none;font-size:14px;background:none;border:0;padding:2px 0;cursor:pointer}.submit{width:100%;height:48px;margin-top:38px;border:0;border-radius:12px;background:#6539e9;color:white;font:650 16px system-ui;cursor:pointer}.submit:hover{background:#562bd7}.submit:disabled{opacity:.6;cursor:wait}.viewer{display:block;text-align:center;margin:18px auto 0;background:none;border:0;color:#675f7c;font:14px system-ui;cursor:pointer}.message{min-height:20px;color:#b42318;font-size:13px;margin:12px 0 -18px}.recovery{color:#675f7c;line-height:1.5;margin:12px 0}.recovery[hidden]{display:none}button:focus-visible{outline:3px solid #8764ec;outline-offset:3px}
</style></head><body><main class="login-card"><h1>Welcome to HospKart</h1><form id="login">
<label for="email">Email address</label><div class="field"><input id="email" type="email" autocomplete="username" required maxlength="254" placeholder="you@company.com"></div>
<label for="password">Password</label><div class="field"><input id="password" type="password" autocomplete="current-password" required maxlength="1024"><button class="eye" type="button" id="toggle" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3.5"/></svg></button></div>
<button class="forgot" id="forgot" type="button" aria-expanded="false" aria-controls="recovery">Forgot password?</button><p class="recovery" id="recovery" hidden>Contact the person who manages this application to reset the admin password.</p><p class="message" id="message" role="alert"></p><button class="submit" type="submit">Login</button></form><button class="viewer" id="viewer" type="button">Continue as viewer →</button>
</main><script src="/static/login.js?v=1"></script></body></html>
