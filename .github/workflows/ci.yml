name: CI

on:
  push:
    branches: [main, production-hardening, deploy/organizer]
  pull_request:
    branches: [main, deploy/organizer]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py drive_import.py exports.py import_service.py storage.py vendor_core.py
      - run: python -m pytest tests -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vendor-dashboard:test .

  organizer-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-organizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-organizer/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app vendor_dashboard hospkart_chat
      - run: python -m pytest tests -q
